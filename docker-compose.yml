services:
  edu-bot:
    build: .
    container_name: edu_bot
    restart: unless-stopped
    # Токены уже вписаны в school_bot.py — отдельно задавать их не нужно.
    # Если понадобится переопределить без правки кода, раскомментируйте и
    # создайте .env рядом с этим файлом:
    # environment:
    #   - VK_TOKEN=${VK_TOKEN}
    #   - MAX_TOKEN=${MAX_TOKEN}
    volumes:
      # Весь проект целиком — код, расписание, меню, кэши, сертификат,
      # логи. Так замена schedule.xlsx или дозапись логов видна и внутри,
      # и снаружи контейнера без пересборки образа.
      - .:/app
